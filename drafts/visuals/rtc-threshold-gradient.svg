<svg viewBox="0 0 760 300" role="img" aria-labelledby="thTitle thDesc"
     style="width:100%;height:auto;background:var(--ground-sunk);border:1px solid var(--rule);border-radius:3px;">
  <title id="thTitle">Two thresholds, three behaviours</title>
  <desc id="thDesc">
    A horizontal confidence scale from zero to one hundred per cent, divided by two thresholds an
    administrator sets. Above the higher threshold the prediction is applied automatically. Between
    the two thresholds it is routed to a support rep to confirm. Below the lower threshold nothing
    happens and the field is left empty.
  </desc>

  <!-- band fills -->
  <g>
    <rect x="60" y="96" width="200" height="56" fill="var(--ink-faint)" fill-opacity="0.10"/>
    <rect x="260" y="96" width="230" height="56" fill="var(--accent)" fill-opacity="0.14"/>
    <rect x="490" y="96" width="210" height="56" fill="var(--accent)" fill-opacity="0.34"/>
  </g>

  <!-- axis -->
  <line x1="60" y1="152" x2="700" y2="152" stroke="var(--ink-soft)" stroke-width="1.5"/>
  <g font-family="var(--face-text)" font-size="11" fill="var(--ink-faint)">
    <text x="60" y="172">0%</text>
    <text x="700" y="172" text-anchor="end">100%</text>
    <text x="380" y="190" text-anchor="middle" letter-spacing="1.4">MODEL CONFIDENCE</text>
  </g>

  <!-- threshold markers -->
  <g stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 3">
    <line x1="260" y1="88" x2="260" y2="160"/>
    <line x1="490" y1="88" x2="490" y2="160"/>
  </g>
  <g font-family="var(--face-text)" font-size="11" font-weight="600" fill="var(--accent)" text-anchor="middle">
    <text x="260" y="80">triage threshold</text>
    <text x="490" y="80">automation threshold</text>
  </g>

  <!-- band labels -->
  <g font-family="var(--face-text)" text-anchor="middle">
    <text x="160" y="122" font-size="14" font-weight="600" fill="var(--ink-soft)">Left alone</text>
    <text x="160" y="140" font-size="11.5" fill="var(--ink-faint)">field stays empty</text>

    <text x="375" y="122" font-size="14" font-weight="600" fill="var(--ink)">Routed to a rep</text>
    <text x="375" y="140" font-size="11.5" fill="var(--ink-soft)">suggested, a person confirms</text>

    <text x="595" y="122" font-size="14" font-weight="600" fill="var(--ink)">Applied automatically</text>
    <text x="595" y="140" font-size="11.5" fill="var(--ink-soft)">no one is asked</text>
  </g>

  <!-- who acts -->
  <g font-family="var(--face-text)" font-size="10.5" fill="var(--ink-faint)" text-anchor="middle" letter-spacing="1.2">
    <text x="160" y="228">NOBODY</text>
    <text x="375" y="228">A PERSON</text>
    <text x="595" y="228">THE MODEL</text>
  </g>
  <g stroke="var(--rule)" stroke-width="1">
    <line x1="160" y1="206" x2="160" y2="214"/>
    <line x1="375" y1="206" x2="375" y2="214"/>
    <line x1="595" y1="206" x2="595" y2="214"/>
  </g>
  <text x="380" y="256" font-family="var(--face-text)" font-size="10.5" fill="var(--ink-faint)"
        text-anchor="middle" letter-spacing="1.2">WHO DECIDES</text>

  <!-- title -->
  <text x="60" y="40" font-family="var(--face-text)" font-size="16" font-weight="600" fill="var(--ink)">
    The administrator draws both lines
  </text>
  <text x="60" y="58" font-family="var(--face-text)" font-size="12" fill="var(--ink-soft)">
    Per field, not once for the whole system.
  </text>
</svg>