<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The live-threat ellipse from the aerial defense case study, alone.
       The dashed past-threat partner is in the case study diagram but does
       not survive 16px, so the mark keeps only the shape that reads. -->
  <rect width="64" height="64" rx="13" fill="#17161a"/>
  <g transform="rotate(-30 32 32)">
    <ellipse cx="32" cy="32" rx="25" ry="11.5" fill="#b39ae4" fill-opacity="0.4"
             stroke="#b39ae4" stroke-width="4.5"/>
  </g>
</svg>
